name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic PAT with scopes: repo, read:user  -> saved as repo secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mendivaque
          filename: metrics.svg
          committer_branch: metrics
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Istanbul
          config_display: large
          repositories_forks: false
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_ignored: html, css, shell, ruby, lua
          plugin_languages_skipped: slack-clone-client, slack-clone-api, Discord-Clone, trello-clone, Taskmaster-Microsoft-Todo-PC-App-FullStack-Clone
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
